<div class="auth-page">
  <div class="auth-image">
    <div class="auth-image-overlay">
      <div class="brand">
        <span class="brand-logo">📚</span>
        <span class="brand-name">Book &amp; Quotes</span>
      </div>
      <div class="tagline">
        <h1>Your personal<br />library, curated.</h1>
        <p>Track the books you love. Collect the words that move you. Build a library entirely your own.</p>
      </div>
    </div>
  </div>

  <div class="auth-form-panel">
    <div class="auth-form-mobile-brand">
      <span class="brand-logo">📚</span>
      <span class="brand-name">Book &amp; Quotes</span>
    </div>

    <div class="auth-form-wrapper">
      <h2>Welcome back.</h2>
      <p class="subtitle">Sign in to access your library.</p>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              required
            />
            <button type="button" class="toggle-visibility" (click)="togglePassword()">👁</button>
          </div>
        </div>

        @if (errorMessage()) {
          <p class="error-message">{{ errorMessage() }}</p>
        }

        <button type="submit" class="submit-btn" [disabled]="loading() || loginForm.invalid">
          {{ loading() ? 'Signing in...' : 'Sign In' }}
        </button>

        <p class="switch-auth">Don't have an account? <a routerLink="/register">Sign up</a></p>
      </form>
    </div>
  </div>
</div>
